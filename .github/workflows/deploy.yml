name: Deploy to WordPress.org
on:
  push:
    tags:
      - "*"
permissions:
  contents: write
jobs:
  tag:
    name: New tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: WordPress Plugin Deploy
        uses: debba/action-wordpress-plugin-deploy@develop
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SLUG: emailchef-for-woocommerce
          ASSETS_DIR: .wordpress-org/assets
          README_DIR: .wordpress-org/readme
      # Package the plugin exactly as deployed (same rsync + .distignore
      # logic as the deploy action) and attach it to the GitHub release.
      - name: Package plugin zip
        run: |
          mkdir -p /tmp/package/emailchef-for-woocommerce
          rsync -rc --exclude-from=.distignore ./ /tmp/package/emailchef-for-woocommerce/ --delete --delete-excluded
          cd /tmp/package
          zip -rq emailchef-for-woocommerce.zip emailchef-for-woocommerce
      - name: Create GitHub release with plugin zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" /tmp/package/emailchef-for-woocommerce.zip \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
